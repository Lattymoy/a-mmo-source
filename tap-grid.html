<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>grid proto</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#05070A;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  body{display:flex;flex-direction:column;user-select:none;touch-action:manipulation}

  #top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
    font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#4A5A66;flex:0 0 auto}
  #top .stat{color:#8A9AA6}
  #top .stat b{color:#D8E4EC;font-weight:500}
  #top .sp{flex:1}
  .tog{border:1px solid #1C2830;background:transparent;color:#5C6E7A;
    font:inherit;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
    padding:5px 8px;border-radius:2px}
  .tog:active{background:#111A20}

  #wrap{flex:1;position:relative;min-height:0}
  canvas{display:block;width:100%;height:100%}

  #log{position:absolute;left:12px;right:12px;bottom:8px;pointer-events:none;
    font-size:10.5px;line-height:1.5;letter-spacing:.02em;color:#5E7080}
  #log div:last-child{color:#A8BCC8}

  #bar{flex:0 0 auto;display:flex;gap:6px;padding:8px 10px calc(env(safe-area-inset-bottom) + 10px)}
  .ab{flex:1;height:58px;border:1px solid #17222A;background:#0A0E12;border-radius:3px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:#5C6E7A;font:inherit;position:relative;overflow:hidden}
  .ab .g{font-size:19px;line-height:1;color:#8A9AA6}
  .ab .n{font-size:8px;letter-spacing:.13em;text-transform:uppercase}
  .ab.armed{border-color:#3E6E8C;background:#0E1A22}
  .ab.armed .g,.ab.armed .n{color:#9CD8F4}
  .ab.cool{opacity:.32}
  .ab .cd{position:absolute;left:0;bottom:0;height:2px;background:#3E6E8C}
  #eq{position:absolute;inset:0;display:none;flex-direction:column;
    background:rgba(5,8,12,.94);padding:18px 16px;overflow:auto}
  #eq.on{display:flex}
  #eq h2{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#4A5A66;
    font-weight:500;margin-bottom:12px}
  #eqSlots{display:flex;gap:8px;margin-bottom:6px}
  .slot{flex:1;border:1px solid #1C2830;border-radius:3px;padding:12px 8px;text-align:center}
  .slot .lab{font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:#4A5A66}
  .slot .val{font-size:24px;color:#E8C87A;line-height:1.3;min-height:31px}
  .slot .val.empty{color:#243038}
  #eqStat{display:flex;gap:16px;margin:14px 0 16px;font-size:10px;
    letter-spacing:.14em;text-transform:uppercase;color:#5C6E7A}
  #eqStat b{color:#D8E4EC;font-weight:500}
  #eqList{display:flex;flex-direction:column;gap:4px}
  .row{display:flex;align-items:center;gap:12px;padding:11px 12px;
    border:1px solid #17222A;border-radius:3px;background:#0A0E12;color:#8A9AA6;
    font:inherit;font-size:11px;text-align:left}
  .row.on{border-color:#3E6E8C;background:#0E1A22;color:#9CD8F4}
  .row .g{font-size:19px;width:20px;text-align:center;color:#E8C87A}
  .row .n{flex:1;letter-spacing:.06em}
  .row .s{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#4A5A66}
  .row:disabled{opacity:.4}
  #eqClose{margin-top:18px;align-self:flex-start}
  #dead{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(5,7,10,.86);color:#C4553A;font-size:12px;letter-spacing:.2em;text-transform:uppercase}
</style>
</head>
<body>

<div id="top">
  <span class="stat">HP <b id="hp">20</b></span>
  <span class="stat">LVL <b id="lvl">1</b></span>
  <span class="stat">T <b id="clk">0</b></span>
  <span class="stat" id="inv">— — —</span>
  <span class="sp"></span>
  <button class="tog" id="bEq">gear</button>
  <button class="tog" id="bLvl">lvl+</button>
  <button class="tog" id="bBiome">uncorrupt</button>
  <button class="tog" id="bTheme">board</button>
  <button class="tog" id="bCam">close</button>
  <button class="tog" id="bNew">new</button>
</div>

<div id="wrap">
  <canvas id="c"></canvas>
  <div id="log"></div>
  <div id="eq">
    <h2>Equipment</h2>
    <div id="eqSlots">
      <div class="slot"><div class="lab">off hand</div><div class="val" id="slotOff">—</div></div>
      <div class="slot"><div class="lab">main hand</div><div class="val" id="slotMain">—</div></div>
    </div>
    <div id="eqStat"><span>ATK <b id="eqAtk">3</b></span><span>DEF <b id="eqDef">0</b></span></div>
    <div id="eqList"></div>
    <button class="tog" id="eqClose">close</button>
  </div>
  <div id="dead">dead — tap new</div>
</div>

<div id="bar"></div>

<script>
/* ───────────────────────── config ───────────────────────── */
const W = 56, H = 56, FOV = 8;
const LVL_MAX = 25;          // max level, base game
const MS_PER_TICK = 0.70;    // real ms per game tick — a 100-tick step is 70ms
const MOVE_MS = 65;          // glyph slide duration, lands just before the next step

/* ───────────────────────── rng ───────────────────────── */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd = mulberry32(Date.now()&0xffffffff);
const ri=(n)=>Math.floor(rnd()*n);

/* ───────────────────────── state ───────────────────────── */
let wall, seen, vis, flora, ents, player, clock, waiting, dead;
let wface;   // 0 = buried rock, else 1 + connection mask (1=N 2=E 4=S 8=W)
let path = [], armed = null, valid = null;
let logs = [];

const idx=(x,y)=>y*W+x;
const inB=(x,y)=>x>=0&&y>=0&&x<W&&y<H;
const isWall=(x,y)=>!inB(x,y)||wall[idx(x,y)]===1;
const dist=(a,b,c,d)=>Math.max(Math.abs(a-c),Math.abs(b-d));

/* ───────────────────────── map ───────────────────────── */
function genMap(){
  wall = new Uint8Array(W*H);
  for(let i=0;i<W*H;i++) wall[i] = rnd()<0.45 ? 1 : 0;
  for(let x=0;x<W;x++){wall[idx(x,0)]=1;wall[idx(x,H-1)]=1}
  for(let y=0;y<H;y++){wall[idx(0,y)]=1;wall[idx(W-1,y)]=1}

  for(let pass=0;pass<5;pass++){
    const nx = wall.slice();
    for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
      let n=0;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)
        if(dx||dy) n += wall[idx(x+dx,y+dy)];
      nx[idx(x,y)] = n>=5 ? 1 : (n<=2 ? 0 : wall[idx(x,y)]);
    }
    wall = nx;
  }

  // keep only the largest open region
  const reg = new Int32Array(W*H).fill(-1);
  let best=-1, bestN=0, id=0;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(wall[idx(x,y)]||reg[idx(x,y)]>=0) continue;
    const q=[[x,y]]; reg[idx(x,y)]=id; let n=0;
    while(q.length){
      const [cx,cy]=q.pop(); n++;
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const a=cx+dx,b=cy+dy;
        if(inB(a,b)&&!wall[idx(a,b)]&&reg[idx(a,b)]<0){reg[idx(a,b)]=id;q.push([a,b])}
      }
    }
    if(n>bestN){bestN=n;best=id}
    id++;
  }
  for(let i=0;i<W*H;i++) if(!wall[i] && reg[i]!==best) wall[i]=1;

  seen = new Uint8Array(W*H);
  vis  = new Uint8Array(W*H);
  computeWallGeometry();
  return bestN;
}

/* Walls are geometry, not texture. A wall tile that touches open floor is a
   FACE — the surface you can actually see. Faces connect to neighbouring faces,
   so the contour of a chamber draws itself with proper corners, tees and ends.
   Wall tiles with no floor around them are buried rock and stay recessive.

   Faces are STROKED, not lettered. Box-drawing glyphs only tile in a terminal,
   where the cell is ~0.6 as wide as it is tall; on a square grid the strokes
   never meet and the wall reads as dashes. Drawing centre-to-edge segments
   guarantees adjacent faces join exactly on the shared edge. Mask bits:
   1=N 2=E 4=S 8=W. */
function computeWallGeometry(){
  const face = new Uint8Array(W*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(!wall[idx(x,y)]) continue;
    let touchesFloor = false;
    for(let dy=-1;dy<=1&&!touchesFloor;dy++)for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy) continue;
      const a=x+dx,b=y+dy;
      if(inB(a,b)&&!wall[idx(a,b)]){ touchesFloor=true; break }
    }
    if(touchesFloor) face[idx(x,y)] = 1;
  }
  wface = new Uint8Array(W*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(!face[idx(x,y)]) continue;
    let m = 0;
    if(inB(x,y-1)&&face[idx(x,y-1)]) m |= 1;
    if(inB(x+1,y)&&face[idx(x+1,y)]) m |= 2;
    if(inB(x,y+1)&&face[idx(x,y+1)]) m |= 4;
    if(inB(x-1,y)&&face[idx(x-1,y)]) m |= 8;
    wface[idx(x,y)] = 1 + m;
  }
}

function openTiles(){
  const o=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++) if(!wall[idx(x,y)]) o.push([x,y]);
  return o;
}

/* ───────────────────────── ground ─────────────────────────
   Anything lying on the floor. Two classes:
     flora — traits, not recipes; the crafting layer reads these
     gear  — MAC's glyphs. Gear is manufactured, so it takes its colour from
             the theme, never from the biome, same rule as entities.        */
const GROUND = {
  fiber:   {g:'"', name:'fiber',   cls:'flora', traits:'fibrous'},
  resin:   {g:'%', name:'resin',   cls:'flora', traits:'resinous'},
  crystal: {g:'*', name:'crystal', cls:'flora', traits:'brittle'},
  sword:   {g:'/', name:'sword',    cls:'gear', slot:'main', atk:3},
  bow:     {g:'}', name:'bow',      cls:'gear', slot:'main', atk:3, twoHand:true, ranged:true},
  daggerR: {g:'>', name:'dagger',   cls:'gear', slot:'main', atk:2},
  daggerL: {g:'<', name:'dagger',   cls:'gear', slot:'off',  atk:2},
  shield:  {g:'c', name:'shield',   cls:'gear', slot:'off',  def:2},
};
const FLORA_KEYS = Object.keys(GROUND).filter(k=>GROUND[k].cls==='flora');
const GEAR_KEYS  = Object.keys(GROUND).filter(k=>GROUND[k].cls==='gear');
function scatterGround(open){
  flora = new Map();
  const nF = Math.floor(open.length*0.035);
  for(let i=0;i<nF;i++){
    const [x,y] = open[ri(open.length)];
    flora.set(idx(x,y), FLORA_KEYS[ri(FLORA_KEYS.length)]);
  }
  const nG = Math.max(4, Math.floor(open.length*0.008));
  for(let i=0;i<nG;i++){
    const [x,y] = open[ri(open.length)];
    flora.set(idx(x,y), GEAR_KEYS[ri(GEAR_KEYS.length)]);
  }
}

/* ───────────────────────── entities ───────────────────────── */
const KINDS = {
  husk:  {g:'\u25A1', name:'husk',  hp:5,  spd:85,  dmg:[1,3], sight:9},
  // heavy variant is NOT stated — placeholder glyph, flag if wrong
  heavy: {g:'\u25A3', name:'heavy', hp:16, spd:160, dmg:[4,7], sight:8},
};
function spawn(open){
  ents = [];
  const [px,py] = open[ri(open.length)];
  player = {x:px,y:py,glyph:'@',lvl:1,hp:20,max:20,spd:100,next:0,you:true,
            ax:px,ay:py,at:-9999, inv:{}, eq:{main:null, off:null}};
  ents.push(player);

  const pool = ['husk','husk','husk','husk','heavy'];
  const n = 16;
  let tries = 0;
  while(ents.length < n+1 && tries++ < 4000){
    const [x,y] = open[ri(open.length)];
    if(dist(x,y,px,py) < 12) continue;
    if(ents.some(e=>e.x===x&&e.y===y)) continue;
    const k = pool[ri(pool.length)], K = KINDS[k];
    ents.push({x,y,glyph:K.g,kind:k,hp:K.hp,max:K.hp,spd:K.spd,next:0,
               ax:x,ay:y,at:-9999});
  }
}
const entAt=(x,y)=>ents.find(e=>e.hp>0&&e.x===x&&e.y===y);

/* Weapons raise Attack, a shield raises Defense. Base 3 so an unarmed player
   still hits for something. */
const BASE_ATK = 3;
function atkOf(p){
  let a = BASE_ATK;
  for(const k of [p.eq.main, p.eq.off]) if(k && GROUND[k].atk) a += GROUND[k].atk;
  return a;
}
function defOf(p){
  let d = 0;
  for(const k of [p.eq.main, p.eq.off]) if(k && GROUND[k].def) d += GROUND[k].def;
  return d;
}
function equip(k){
  const G = GROUND[k];
  if(!G || G.cls!=='gear') return;
  const slot = G.slot;
  if(player.eq[slot] === k){ player.eq[slot] = null; }      // tap again to remove
  else {
    player.eq[slot] = k;
    if(G.twoHand) player.eq.off = null;
    else if(slot==='off' && player.eq.main && GROUND[player.eq.main].twoHand)
      player.eq.main = null;
  }
  hud();
}

/* ───────────────────────── fov / los ───────────────────────── */
function los(x0,y0,x1,y1){
  let dx=Math.abs(x1-x0), dy=Math.abs(y1-y0);
  let sx=x0<x1?1:-1, sy=y0<y1?1:-1, err=dx-dy, x=x0, y=y0;
  while(x!==x1||y!==y1){
    const e2=2*err;
    if(e2>-dy){err-=dy;x+=sx}
    if(e2<dx){err+=dx;y+=sy}
    if(x===x1&&y===y1) return true;
    if(isWall(x,y)) return false;
  }
  return true;
}
function computeFOV(){
  vis.fill(0);
  for(let y=player.y-FOV;y<=player.y+FOV;y++)
    for(let x=player.x-FOV;x<=player.x+FOV;x++){
      if(!inB(x,y)) continue;
      if(dist(x,y,player.x,player.y)>FOV) continue;
      if(los(player.x,player.y,x,y)){ vis[idx(x,y)]=1; seen[idx(x,y)]=1 }
    }
}

/* ───────────────────────── pathing ───────────────────────── */
function pathTo(tx,ty){
  if(isWall(tx,ty)) return [];
  const prev = new Int32Array(W*H).fill(-1);
  const q = [idx(player.x,player.y)];
  prev[q[0]] = q[0];
  const goal = idx(tx,ty);
  for(let h=0; h<q.length; h++){
    const cur = q[h];
    if(cur===goal) break;
    const cx = cur%W, cy = (cur/W)|0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy) continue;
      const a=cx+dx,b=cy+dy;
      if(!inB(a,b)||wall[idx(a,b)]||prev[idx(a,b)]>=0) continue;
      const e = entAt(a,b);
      if(e && idx(a,b)!==goal) continue;      // route around bodies, not through
      prev[idx(a,b)] = cur;
      q.push(idx(a,b));
    }
  }
  if(prev[goal]<0) return [];
  const out=[]; let c=goal;
  while(c!==idx(player.x,player.y)){ out.unshift([c%W,(c/W)|0]); c=prev[c] }
  return out;
}

/* ───────────────────────── abilities ───────────────────────── */
// arming makes the next tap modal — so arming must *show* its own legal set
const ABIL = [
  {id:'dash',   g:'»', name:'dash',   cost:60,  cd:280,
   tiles(){ const t=[];
     for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
       for(let n=1;n<=3;n++){
         const x=player.x+dx*n, y=player.y+dy*n;
         if(isWall(x,y)||entAt(x,y)) break;
         t.push([x,y]);
       }} return t },
   fire(x,y){ const d=Math.max(Math.abs(x-player.x),Math.abs(y-player.y));
     stepTo(x,y); say(`dash ${d}`); return true }},

  {id:'cleave', g:'✳', name:'cleave', cost:150, cd:420,
   tiles(){ const t=[];
     for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
       if(!dx&&!dy) continue;
       const x=player.x+dx,y=player.y+dy;
       if(inB(x,y)&&!isWall(x,y)) t.push([x,y]);
     } return t },
   fire(x,y){
     const dx=Math.sign(x-player.x), dy=Math.sign(y-player.y);
     const arc = dx&&dy ? [[dx,dy],[dx,0],[0,dy]]
                        : dx ? [[dx,-1],[dx,0],[dx,1]] : [[-1,dy],[0,dy],[1,dy]];
     let hit=0;
     lungeAt(player, x, y, false); swing(player);
     for(const [ax,ay] of arc){
       slashAt(player.x, player.y, player.x+ax, player.y+ay);
       const e = entAt(player.x+ax, player.y+ay);
       if(e && !e.you){ damage(e, atkOf(player)+ri(3)); hit++ }
     }
     say(hit ? `cleave — ${hit} hit` : 'cleave — nothing');
     return true }},

  {id:'hurl',   g:'↗', name:'hurl',   cost:100, cd:240,
   tiles(){ const t=[];
     for(let y=player.y-5;y<=player.y+5;y++)for(let x=player.x-5;x<=player.x+5;x++){
       if(!inB(x,y)||isWall(x,y)) continue;
       if(dist(x,y,player.x,player.y)>5||dist(x,y,player.x,player.y)===0) continue;
       if(!vis[idx(x,y)]) continue;
       t.push([x,y]);
     } return t },
   fire(x,y){
     const bow = player.eq.main && GROUND[player.eq.main].ranged;
     lungeAt(player, x, y, true); swing(player);
     shotAt(player.x, player.y, x, y, bow ? '\u2192' : '\u00b7');
     const e=entAt(x,y);
     if(e&&!e.you){ damage(e, atkOf(player)+ri(3)); say(`hurl — ${KINDS[e.kind].name}`) }
     else say('hurl — miss');
     return true }},

  {id:'gather', g:'⌂', name:'gather', cost:80,  cd:0,
   tiles(){ const t=[];
     for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
       const x=player.x+dx,y=player.y+dy;
       if(inB(x,y)&&flora.has(idx(x,y))) t.push([x,y]);
     } return t },
   fire(x,y){ const k=flora.get(idx(x,y));
     if(!k) return false;
     const G = GROUND[k];
     flora.delete(idx(x,y));
     player.inv[k] = (player.inv[k]||0) + 1;
     say(G.cls==='gear' ? `picked up ${G.name} ${G.g}`
                        : `gathered ${G.name} — ${G.traits}`);
     return true }},
];
const cooldown = {};

/* ───────────────────────── motion & fx ─────────────────────────
   Melee lunges INTO the target and settles back. Ranged recoils the other way.
   Both read as intent even when the damage number is off screen. */
let fx = [];
const LUNGE_MS = 190, SLASH_MS = 170, SHOT_MS = 190;

function lungeAt(e, tx, ty, ranged){
  const dx = tx-e.x, dy = ty-e.y;
  const m = Math.hypot(dx,dy) || 1;
  e.lg = {dx:dx/m, dy:dy/m, amt: ranged ? -0.22 : 0.40,
          t0: performance.now(), dur: LUNGE_MS};
}
function slashAt(ax, ay, tx, ty){
  fx.push({type:'slash', x:tx, y:ty, ang:Math.atan2(ty-ay, tx-ax),
           t0:performance.now(), dur:SLASH_MS});
}
function shotAt(ax, ay, tx, ty, g){
  fx.push({type:'shot', x0:ax, y0:ay, x1:tx, y1:ty, g:g||'\u00b7',
           t0:performance.now(), dur:SHOT_MS});
}
function swing(e){ e.sw = {t0:performance.now(), dur:LUNGE_MS} }

/* ───────────────────────── actions ───────────────────────── */
let queued = null;   // {type:'ability'|'attack', ...}

function stepTo(x,y){
  player.ax=player.x; player.ay=player.y; player.at=performance.now();
  player.x=x; player.y=y;
}
function damage(e,n){
  e.hp -= n;
  if(e.hp<=0){
    if(e.you){ dead=true; document.getElementById('dead').style.display='flex'; say('you died') }
    else say(`${KINDS[e.kind].name} dies`);
  }
}
function say(s){ logs.push(s); if(logs.length>3) logs.shift(); drawLog() }

// returns cost in ticks, or 0 if the player still needs input
function playerAct(){
  if(queued){
    const q = queued; queued = null;
    if(q.type==='attack'){
      const e = entAt(q.x,q.y);
      if(e && !e.you && dist(e.x,e.y,player.x,player.y)<=1){
        lungeAt(player, e.x, e.y, false); slashAt(player.x,player.y,e.x,e.y); swing(player);
        damage(e, atkOf(player)+ri(3)); say(`hit ${KINDS[e.kind].name}`);
        return 120;
      }
      return 0;
    }
    if(q.type==='ability'){
      const A = ABIL.find(a=>a.id===q.id);
      if(A.fire(q.x,q.y)){ cooldown[A.id] = clock + A.cd; return A.cost }
      return 0;
    }
  }
  if(path.length){
    const [x,y] = path[0];
    const e = entAt(x,y);
    if(e && !e.you){
      path = [];
      lungeAt(player, e.x, e.y, false); slashAt(player.x,player.y,e.x,e.y); swing(player);
      damage(e, atkOf(player)+ri(3)); say(`hit ${KINDS[e.kind].name}`);
      return 120;
    }
    path.shift();
    stepTo(x,y);
    return 100;
  }
  return 0;
}

function monsterAct(m){
  const K = KINDS[m.kind];
  const d = dist(m.x,m.y,player.x,player.y);
  const sees = d<=K.sight && los(m.x,m.y,player.x,player.y);
  if(sees && d<=1){
    lungeAt(m, player.x, player.y, false);
    slashAt(m.x, m.y, player.x, player.y);
    const raw = K.dmg[0]+ri(K.dmg[1]-K.dmg[0]+1);
    const dealt = Math.max(1, raw - defOf(player));
    damage(player, dealt);
    say(`${K.name} hits you${dealt<raw ? ' \u2014 blocked '+(raw-dealt) : ''}`);
    return K.spd;
  }
  if(sees){
    let bx=0,by=0,bd=d;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy) continue;
      const x=m.x+dx,y=m.y+dy;
      if(isWall(x,y)||entAt(x,y)) continue;
      const nd = dist(x,y,player.x,player.y);
      if(nd<bd){bd=nd;bx=dx;by=dy}
    }
    if(bx||by){ m.ax=m.x;m.ay=m.y;m.at=performance.now(); m.x+=bx;m.y+=by }
    return K.spd;
  }
  if(rnd()<0.35){
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    const [dx,dy]=dirs[ri(4)];
    const x=m.x+dx,y=m.y+dy;
    if(!isWall(x,y)&&!entAt(x,y)){ m.ax=m.x;m.ay=m.y;m.at=performance.now(); m.x=x;m.y=y }
  }
  return K.spd;
}

/* ───────────────────────── scheduler ─────────────────────────
   Time only moves when someone acts, but nobody can stall it:
   an actor with nothing to do is skipped, not waited on.        */
// Wall-clock pace is a property of GAME TIME, not of how many actors exist.
// The clock advances at a fixed real-time rate; every actor whose turn has come
// due resolves in the same frame. Adding monsters no longer slows the player.
function drain(){
  for(let guard=0; guard<512; guard++){
    let a=null;
    for(const e of ents) if(e.hp>0 && (!a || e.next<a.next)) a=e;
    if(!a || a.next > clock) return;

    if(a.you){
      const cost = playerAct();
      if(cost===0){ waiting = true; return }   // nothing to do: hold the clock
      a.next += cost;
      computeFOV();
      if(armed) valid = validSet(armed);
    } else {
      a.next += monsterAct(a);
    }
    ents = ents.filter(e=>e.hp>0||e.you);
    hud();
    if(dead) return;
  }
}

/* ───────────────────────── input ───────────────────────── */
function validSet(id){
  const A = ABIL.find(a=>a.id===id);
  const s = new Set();
  for(const [x,y] of A.tiles()) s.add(idx(x,y));
  return s;
}
function arm(id){
  if(dead) return;
  if(armed===id){ armed=null; valid=null; bar(); return }
  if((cooldown[id]||0) > clock) return;
  armed = id; valid = validSet(id); bar();
}
function tapTile(x,y){
  if(dead||!inB(x,y)) return;
  if(armed){
    if(valid.has(idx(x,y))){
      queued = {type:'ability', id:armed, x, y};
      path = []; armed = null; valid = null; bar(); waiting = false;
    } else {
      armed = null; valid = null; bar();   // tap outside the lit set disarms, never misfires
    }
    return;
  }
  const e = entAt(x,y);
  if(e && !e.you && dist(x,y,player.x,player.y)<=1){
    queued = {type:'attack', x, y}; path = []; waiting = false; return;
  }
  if(e && !e.you){
    // walk to a tile adjacent to it, then the next tap swings
    let best=null,bd=1e9;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      const a=x+dx,b=y+dy;
      if(isWall(a,b)||entAt(a,b)) continue;
      const p = pathTo(a,b);
      if(p.length && p.length<bd){bd=p.length;best=p}
    }
    if(best){ path=best; waiting=false }
    return;
  }
  const p = pathTo(x,y);
  if(p.length){ path = p; waiting = false }   // any new tap replaces the old route
}

/* ───────────────────────── themes ─────────────────────────
   Same simulation, three readings of it. */
const THEMES = {
  phosphor:{
    bg:'#05070A', floorGlyph:'·', wallGlyph:'#',
    floor:'#16342A', wall:'#2C6048', mem:'#0E2019',
    you:'#9DFFD0', gear:'#CFE9FF', mon:'#FF9B7A', flora:'#7FE8A8', cell:null,
    glow:8, lit:'#63C4E8', grid:false
  },
  bone:{
    bg:'#0B0A0C', floorGlyph:'.', wallGlyph:'#',
    floor:'#332C38', wall:'#6E6070', mem:'#1D1920',
    you:'#F0E6D4', gear:'#D8B87A', mon:'#C4553A', flora:'#8CA85E', cell:null,
    glow:0, lit:'#D8A24C', grid:false
  },
  board:{
    bg:'#080B0F', floorGlyph:'·', wallGlyph:'▓',
    floor:'#4A5C6A', wall:'#7E93A4', mem:'#222A33', cell:'#141B22',
    you:'#EAF4FF', gear:'#E8C87A', mon:'#E86A5A', flora:'#6FBF8E',
    glow:0, lit:'#4E9AC4', grid:true
  },
};
/* Biome is COLOUR ONLY. Theme owns treatment — background, glyphs, glow, grid,
   entity colours. Biome owns the terrain palette. Same map, same glyphs, a
   different world. Band names are Raum's, verified from project-raum. */
const BIOMES = {
  none:      null,
  uncorrupt: {floor:'#4A6B5A', wall:'#7E9B88', mem:'#161F1A', cell:'#111A15', flora:'#8FCF7A'},
  corrupt:   {floor:'#6B5A72', wall:'#9B84A4', mem:'#1C1622', cell:'#17111D', flora:'#B08A4A'},
  shaped:    {floor:'#55697E', wall:'#8FA6BE', mem:'#141B23', cell:'#0E151D', flora:'#7FD4E8'},
};

let theme = 'board', cam = 'close', biome = 'uncorrupt';
const COLS = {close:11, tactical:25};

/* ───────────────────────── render ───────────────────────── */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let TS=24, cols=11, rows=14, ox=0, oy=0, dpr=1;

function resize(){
  dpr = Math.min(devicePixelRatio||1, 2);
  const r = cv.parentElement.getBoundingClientRect();
  cv.width = r.width*dpr; cv.height = r.height*dpr;
  cv.style.width = r.width+'px'; cv.style.height = r.height+'px';
  cols = COLS[cam];
  TS = Math.floor(r.width/cols);
  rows = Math.floor(r.height/TS);
}

function pos(e,now){
  let x = e.x, y = e.y;
  const t = (now-e.at)/MOVE_MS;
  if(t < 1){ const k = t*t*(3-2*t); x = e.ax+(e.x-e.ax)*k; y = e.ay+(e.y-e.ay)*k }
  if(e.lg){
    const u = (now-e.lg.t0)/e.lg.dur;
    if(u >= 1) e.lg = null;
    else { const p = Math.sin(u*Math.PI)*e.lg.amt; x += e.lg.dx*p; y += e.lg.dy*p }
  }
  return [x,y];
}
// 0 at rest, 1 at full swing — drives the weapon's arc
function swingT(e,now){
  if(!e.sw) return 0;
  const u = (now-e.sw.t0)/e.sw.dur;
  if(u >= 1){ e.sw = null; return 0 }
  return Math.sin(u*Math.PI);
}

function draw(now){
  const T = BIOMES[biome] ? Object.assign({}, THEMES[theme], BIOMES[biome]) : THEMES[theme];
  ctx.save(); ctx.scale(dpr,dpr);
  const w = cv.width/dpr, h = cv.height/dpr;
  ctx.fillStyle = T.bg; ctx.fillRect(0,0,w,h);

  const [ppx,ppy] = pos(player,now);
  ox = Math.round((ppx - (cols-1)/2)*TS - (w-cols*TS)/2);
  oy = Math.round((ppy - (rows-1)/2)*TS - (h-rows*TS)/2);

  ctx.font = `${Math.floor(TS*0.78)}px ui-monospace, Menlo, Consolas, monospace`;
  ctx.textAlign='center'; ctx.textBaseline='middle';

  const x0 = Math.floor(ox/TS)-1, y0 = Math.floor(oy/TS)-1;
  const dim = armed ? 0.18 : 1;                      // the arm-state hush
  const pulse = 0.55 + 0.45*Math.sin(now/260);

  for(let y=y0;y<y0+rows+3;y++)for(let x=x0;x<x0+cols+3;x++){
    if(!inB(x,y)||!seen[idx(x,y)]) continue;
    const sx = x*TS-ox+TS/2, sy = y*TS-oy+TS/2;
    const v = vis[idx(x,y)];
    const isValid = valid && valid.has(idx(x,y));

    if(T.cell){
      ctx.globalAlpha = v ? (isValid?1:dim) : 0.5*dim;
      ctx.fillStyle = T.cell;
      ctx.fillRect(x*TS-ox+(T.grid?1:0), y*TS-oy+(T.grid?1:0), TS-(T.grid?2:0), TS-(T.grid?2:0));
    }
    if(isValid){
      ctx.globalAlpha = 0.20*pulse;
      ctx.fillStyle = T.lit;
      ctx.fillRect(x*TS-ox+1, y*TS-oy+1, TS-2, TS-2);
    }

    const wallT = wall[idx(x,y)]===1;
    const f = wallT ? wface[idx(x,y)] : 0;
    const buried = wallT && !f;
    ctx.globalAlpha = (v ? (isValid?1:dim) : 0.55*dim) * (buried ? 0.30 : 1);
    const fl = flora.get(idx(x,y));
    let col = !v ? T.mem
                 : (wallT ? T.wall
                          : (fl ? (GROUND[fl].cls==='gear' ? T.gear : T.flora) : T.floor));
    if(isValid && !wallT) col = T.lit;
    ctx.shadowBlur = 0;

    if(f){
      const m = f-1, h = TS/2;
      ctx.strokeStyle = col;
      ctx.lineWidth = Math.max(1.5, TS*0.11);
      ctx.lineCap = 'round';
      ctx.beginPath();
      if(m){
        if(m&1){ ctx.moveTo(sx,sy); ctx.lineTo(sx, sy-h) }
        if(m&2){ ctx.moveTo(sx,sy); ctx.lineTo(sx+h, sy) }
        if(m&4){ ctx.moveTo(sx,sy); ctx.lineTo(sx, sy+h) }
        if(m&8){ ctx.moveTo(sx,sy); ctx.lineTo(sx-h, sy) }
        ctx.stroke();
      } else {                                  // isolated pillar
        ctx.fillStyle = col;
        ctx.fillRect(sx-TS*0.16, sy-TS*0.16, TS*0.32, TS*0.32);
      }
    } else {
      ctx.fillStyle = col;
      ctx.fillText(wallT ? T.wallGlyph : (fl ? GROUND[fl].g : T.floorGlyph), sx, sy);
    }
  }

  for(const e of ents){
    if(e.hp<=0) continue;
    if(!vis[idx(e.x,e.y)]) continue;
    const [ex,ey] = pos(e,now);
    const sx = ex*TS-ox+TS/2, sy = ey*TS-oy+TS/2;
    ctx.globalAlpha = e.you ? 1 : dim;
    ctx.fillStyle = e.you ? T.you : T.mon;
    if(T.glow){ ctx.shadowBlur = T.glow; ctx.shadowColor = ctx.fillStyle }
    if(e.you){
      /* c○/   ○}   <○>
         Off hand left, main hand right, ring between. The ring shrinks when
         something is held so all three fit one thumb-sized cell. */
      const held = (e.eq.main?1:0) + (e.eq.off?1:0);
      const r  = held ? TS*0.28 : TS*0.40;
      const lf = held ? TS*0.32 : TS*0.44;
      ctx.strokeStyle = T.you;
      ctx.lineWidth = Math.max(1.3, TS*0.07);
      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, Math.PI*2);
      ctx.stroke();

      const lab = String(e.lvl);
      ctx.save();
      ctx.font = `${Math.floor(lf)}px ui-monospace, Menlo, Consolas, monospace`;
      if(lab.length > 1){ ctx.translate(sx,sy); ctx.scale(0.66,1); ctx.fillText(lab,0,0) }
      else ctx.fillText(lab, sx, sy);
      ctx.restore();

      const sw = swingT(e, now);
      ctx.save();
      ctx.font = `${Math.floor(TS*0.46)}px ui-monospace, Menlo, Consolas, monospace`;
      ctx.fillStyle = T.gear;
      for(const [slot, side] of [['off',-1],['main',1]]){
        const k = e.eq[slot];
        if(!k) continue;
        ctx.save();
        ctx.translate(sx + side*TS*0.36, sy);
        if(sw) ctx.rotate(side * sw * 1.1);          // the weapon swings, not the player
        ctx.fillText(GROUND[k].g, 0, 0);
        ctx.restore();
      }
      ctx.restore();
    } else ctx.fillText(e.glyph, sx, sy);
    ctx.shadowBlur = 0;

    if(!e.you && e.hp < e.max){
      ctx.globalAlpha = dim*0.8;
      ctx.fillStyle = T.mon;
      const bw = (TS-6)*(e.hp/e.max);
      ctx.fillRect(ex*TS-ox+3, ey*TS-oy+TS-3, bw, 1.5);
    }
  }

  // fx over entities
  fx = fx.filter(f => now - f.t0 < f.dur);
  for(const f of fx){
    const u = (now - f.t0)/f.dur;
    if(f.type==='slash'){
      if(!vis[idx(f.x,f.y)]) continue;
      const cx = f.x*TS-ox+TS/2, cy = f.y*TS-oy+TS/2;
      ctx.globalAlpha = Math.sin((1-u)*Math.PI/2) * dim;
      ctx.strokeStyle = T.gear;
      ctx.lineWidth = Math.max(1.5, TS*0.09);
      ctx.lineCap = 'round';
      const a0 = f.ang - 0.85 + u*1.7;
      ctx.beginPath();
      ctx.arc(cx, cy, TS*0.42, a0, a0 + 0.9);
      ctx.stroke();
    } else if(f.type==='shot'){
      const px = f.x0 + (f.x1-f.x0)*u, py = f.y0 + (f.y1-f.y0)*u;
      if(!inB(Math.round(px),Math.round(py)) || !vis[idx(Math.round(px),Math.round(py))]) continue;
      ctx.globalAlpha = dim;
      ctx.fillStyle = T.gear;
      ctx.save();
      ctx.translate(px*TS-ox+TS/2, py*TS-oy+TS/2);
      ctx.rotate(Math.atan2(f.y1-f.y0, f.x1-f.x0));
      ctx.fillText(f.g, 0, 0);
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;

  if(path.length && !armed){
    ctx.globalAlpha = 0.30;
    ctx.fillStyle = T.lit;
    for(const [x,y] of path) ctx.fillRect(x*TS-ox+TS/2-1.5, y*TS-oy+TS/2-1.5, 3, 3);
  }

  ctx.globalAlpha = 1;
  if(cam==='tactical'){
    ctx.fillStyle = 'rgba(5,7,10,.45)'; ctx.fillRect(0,0,w,h);
    ctx.fillStyle = '#5C6E7A'; ctx.font = '10px ui-monospace, monospace';
    ctx.fillText('TACTICAL — TAP TO RETURN', w/2, h-16);
  }
  ctx.restore();
}

/* ───────────────────────── hud ───────────────────────── */
const barEl = document.getElementById('bar');
function bar(){
  barEl.innerHTML = '';
  for(const A of ABIL){
    const cool = (cooldown[A.id]||0) > clock;
    const b = document.createElement('button');
    b.className = 'ab' + (armed===A.id?' armed':'') + (cool?' cool':'');
    b.innerHTML = `<span class="g">${A.g}</span><span class="n">${A.name}</span>`;
    if(cool){
      const left = (cooldown[A.id]-clock)/A.cd;
      const d = document.createElement('div'); d.className='cd';
      d.style.width = (100*(1-left))+'%'; b.appendChild(d);
    }
    b.onclick = ()=>arm(A.id);
    barEl.appendChild(b);
  }
}
function drawEq(){
  const setSlot = (id, k) => {
    const el = document.getElementById(id);
    el.textContent = k ? GROUND[k].g : '\u2014';
    el.className = 'val' + (k ? '' : ' empty');
  };
  setSlot('slotOff',  player.eq.off);
  setSlot('slotMain', player.eq.main);
  document.getElementById('eqAtk').textContent = atkOf(player);
  document.getElementById('eqDef').textContent = defOf(player);

  const list = document.getElementById('eqList');
  list.innerHTML = '';
  const carried = Object.entries(player.inv).filter(([k,n]) => n>0 && GROUND[k].cls==='gear');
  if(!carried.length){
    const d = document.createElement('div');
    d.className = 'row';
    d.textContent = 'Nothing carried. Gather gear off the floor.';
    list.appendChild(d);
    return;
  }
  for(const [k] of carried){
    const G = GROUND[k];
    const on = player.eq[G.slot] === k;
    const b = document.createElement('button');
    b.className = 'row' + (on ? ' on' : '');
    b.innerHTML = `<span class="g">${G.g}</span><span class="n">${G.name}</span>` +
      `<span class="s">${G.atk ? '+'+G.atk+' atk' : ''}${G.def ? '+'+G.def+' def' : ''}` +
      `${G.twoHand ? ' \u00b7 two-hand' : ''}</span>`;
    b.onclick = ()=>{ equip(k); drawEq() };
    list.appendChild(b);
  }
}

function hud(){
  document.getElementById('hp').textContent = Math.max(0,player.hp);
  document.getElementById('lvl').textContent = player.lvl;
  document.getElementById('clk').textContent = Math.floor(clock/100);
  const carried = Object.entries(player.inv).filter(([,n])=>n>0)
    .map(([k,n])=>`${GROUND[k].g}${n}`).join(' ');
  document.getElementById('inv').textContent = carried || '—';
  if(document.getElementById('eq').classList.contains('on')) drawEq();
  bar();
}
function drawLog(){
  document.getElementById('log').innerHTML = logs.map(l=>`<div>${l}</div>`).join('');
}

/* ───────────────────────── loop ───────────────────────── */
let lastT = 0;
function frame(now){
  if(dead || waiting){
    lastT = 0;                                  // resume cleanly, no dt spike
  } else if(!lastT){
    lastT = now;
  } else {
    const dt = Math.min(now - lastT, 250);      // clamp after a backgrounded tab
    lastT = now;
    clock += dt / MS_PER_TICK;
    drain();
  }
  draw(now);
  requestAnimationFrame(frame);
}

/* ───────────────────────── boot ───────────────────────── */
function restart(){
  rnd = mulberry32((Math.random()*1e9)|0);
  const n = genMap();
  const open = openTiles();
  scatterGround(open);
  spawn(open);
  clock=0; waiting=false; dead=false; path=[]; armed=null; valid=null; queued=null; logs=[];
  for(const k in cooldown) delete cooldown[k];
  document.getElementById('dead').style.display='none';
  document.getElementById('eq').classList.remove('on');
  computeFOV(); hud(); say(`${n} open tiles — ${ents.length-1} hostiles`);
  resize();
}

document.getElementById('eq').addEventListener('pointerdown', ev=>ev.stopPropagation());
cv.addEventListener('pointerdown', ev=>{
  const r = cv.getBoundingClientRect();
  if(cam==='tactical'){ cam='close'; document.getElementById('bCam').textContent='close'; resize(); return }
  const x = Math.floor((ev.clientX - r.left + ox)/TS);
  const y = Math.floor((ev.clientY - r.top  + oy)/TS);
  tapTile(x,y);
});

// dev: cycle 1..25 to check two-digit legibility at thumb tile size
document.getElementById('bLvl').onclick = ()=>{
  player.lvl = player.lvl >= LVL_MAX ? 1 : player.lvl + 1;
  hud();
};
document.getElementById('bEq').onclick = ()=>{
  document.getElementById('eq').classList.add('on');
  drawEq();
};
document.getElementById('eqClose').onclick = ()=>{
  document.getElementById('eq').classList.remove('on');
};
document.getElementById('bBiome').onclick = e=>{
  const k = Object.keys(BIOMES);
  biome = k[(k.indexOf(biome)+1)%k.length];
  e.target.textContent = biome;
};
document.getElementById('bTheme').onclick = e=>{
  const k = Object.keys(THEMES);
  theme = k[(k.indexOf(theme)+1)%k.length];
  e.target.textContent = theme;
};
document.getElementById('bCam').onclick = e=>{
  cam = cam==='close' ? 'tactical' : 'close';
  e.target.textContent = cam;
  resize();
};
document.getElementById('bNew').onclick = restart;
addEventListener('resize', resize);

restart();
requestAnimationFrame(frame);
</script>
